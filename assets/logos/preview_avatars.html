<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  body{margin:0;background:#f5f6f8;font-family:"Microsoft YaHei",sans-serif;padding:24px;}
  h3{font-size:14px;color:#444;margin:0 0 10px;font-weight:600;}
  .row{display:flex;gap:18px;align-items:center;margin-bottom:22px;}
  .item{display:flex;flex-direction:column;align-items:center;gap:6px;width:82px;}
  .av{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .av img{width:100%;height:100%;display:block;}
  .cap{font-size:11px;color:#666;}
  .dark{background:#1b1c1f;padding:18px;border-radius:12px;}
  .dark h3{color:#ddd;}
</style></head>
<body>
<h3>浅色主题 · 头像 38dp（按 2x 放大到 76px 预览）</h3>
<div class="row">
  <div class="item"><div class="av" style="background:rgba(43,92,230,.12)"><img src="../../app/src/main/res/drawable-xxxhdpi/logo_doubao.png"></div><div class="cap">豆包</div></div>
  <div class="item"><div class="av" style="background:rgba(107,79,236,.12)"><img src="../../app/src/main/res/drawable-xxxhdpi/logo_qwen.png"></div><div class="cap">通义千问</div></div>
  <div class="item"><div class="av" style="background:rgba(26,115,232,.12)"><img src="../../app/src/main/res/drawable-xxxhdpi/logo_yuanbao.png"></div><div class="cap">腾讯元宝</div></div>
  <div class="item"><div class="av" style="background:rgba(77,107,254,.12)"><img src="../../app/src/main/res/drawable-xxxhdpi/logo_deepseek.png"></div><div class="cap">DeepSeek</div></div>
  <div class="item"><div class="av" style="background:rgba(31,31,31,.12)"><img src="../../app/src/main/res/drawable-xxxhdpi/logo_kimi.png"></div><div class="cap">Kimi</div></div>
  <div class="item"><div class="av" style="background:rgba(217,48,37,.12)"><img src="../../app/src/main/res/drawable-xxxhdpi/logo_spark.png"></div><div class="cap">讯飞星火</div></div>
  <div class="item"><div class="av" style="background:rgba(14,159,138,.12)"><img src="../../app/src/main/res/drawable-xxxhdpi/logo_chatglm.png"></div><div class="cap">智谱清言</div></div>
  <div class="item"><div class="av" style="background:rgba(41,50,225,.12)"><img src="../../app/src/main/res/drawable-xxxhdpi/logo_ernie.png"></div><div class="cap">文心一言</div></div>
</div>

<div class="dark">
  <h3>深色主题 · 同一批资源</h3>
  <div class="row">
    <div class="item"><div class="av" style="background:rgba(43,92,230,.22)"><img src="../../app/src/main/res/drawable-xxxhdpi/logo_doubao.png"></div><div class="cap" style="color:#999">豆包</div></div>
    <div class="item"><div class="av" style="background:rgba(107,79,236,.22)"><img src="../../app/src/main/res/drawable-xxxhdpi/logo_qwen.png"></div><div class="cap" style="color:#999">通义千问</div></div>
    <div class="item"><div class="av" style="background:rgba(26,115,232,.22)"><img src="../../app/src/main/res/drawable-xxxhdpi/logo_yuanbao.png"></div><div class="cap" style="color:#999">腾讯元宝</div></div>
    <div class="item"><div class="av" style="background:rgba(77,107,254,.22)"><img src="../../app/src/main/res/drawable-xxxhdpi/logo_deepseek.png"></div><div class="cap" style="color:#999">DeepSeek</div></div>
    <div class="item"><div class="av" style="background:rgba(255,255,255,.10)"><img src="../../app/src/main/res/drawable-xxxhdpi/logo_kimi.png"></div><div class="cap" style="color:#999">Kimi</div></div>
    <div class="item"><div class="av" style="background:rgba(217,48,37,.22)"><img src="../../app/src/main/res/drawable-xxxhdpi/logo_spark.png"></div><div class="cap" style="color:#999">讯飞星火</div></div>
    <div class="item"><div class="av" style="background:rgba(14,159,138,.22)"><img src="../../app/src/main/res/drawable-xxxhdpi/logo_chatglm.png"></div><div class="cap" style="color:#999">智谱清言</div></div>
    <div class="item"><div class="av" style="background:rgba(41,50,225,.22)"><img src="../../app/src/main/res/drawable-xxxhdpi/logo_ernie.png"></div><div class="cap" style="color:#999">文心一言</div></div>
  </div>
</div>

<h3 style="margin-top:22px">大图检查（192px 原尺寸）</h3>

  <img src="../../app/src/main/res/drawable-xxxhdpi/logo_doubao.png" style="width:192px;height:192px">

  <img src="../../app/src/main/res/drawable-xxxhdpi/logo_spark.png" style="width:192px;height:192px">
  <img src="../../app/src/main/res/drawable-xxxhdpi/logo_chatglm.png" style="width:192px;height:192px">
  <img src="../../app/src/main/res/drawable-xxxhdpi/logo_ernie.png" style="width:192px;height:192px">

</body></html>
