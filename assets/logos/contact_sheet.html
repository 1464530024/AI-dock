<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#eef1f5;font-family:"Microsoft YaHei",sans-serif;}
  .grid{display:grid;grid-template-columns:repeat(4,300px);gap:10px;padding:14px;}
  .cell{background:#fff;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;height:300px;box-sizing:border-box;}
  .cell img{width:170px;height:170px;object-fit:contain;}
  .cap{font-size:13px;color:#333;margin-top:8px;font-weight:600;}
  .dim{font-size:11px;color:#888;font-weight:400;}
</style></head>
<body>
<div class="grid">
  <div class="cell"><img src="doubao_192.png"><div class="cap">豆包 <span class="dim">192px</span></div></div>
  <div class="cell"><img src="qwen_150.png"><div class="cap">通义千问 <span class="dim">150px</span></div></div>
  <div class="cell"><img src="yuanbao_128x128.png"><div class="cap">腾讯元宝 <span class="dim">128px</span></div></div>
  <div class="cell"><img src="deepseek_180.png"><div class="cap">DeepSeek <span class="dim">180px</span></div></div>
  <div class="cell"><img src="kimi_192.png"><div class="cap">Kimi <span class="dim">192px</span></div></div>
  <div class="cell"><img src="_spark_render.png"><div class="cap">讯飞星火 <span class="dim">SVG矢量</span></div></div>
  <div class="cell"><img src="chatglm.ico"><div class="cap">智谱清言 <span class="dim">64px</span></div></div>
  <div class="cell"><img src="wenxin_512.png"><div class="cap">文心一言 <span class="dim">512px</span></div></div>
</div>
</body></html>
