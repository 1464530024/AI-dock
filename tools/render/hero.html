<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1280px; height: 420px; overflow: hidden;
    font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    background: #F5F6FA;
    color: #12131A;
  }
  .card {
    position: relative; width: 1280px; height: 420px;
    background:
      radial-gradient(760px 420px at 88% 12%, #E7EBFF 0%, rgba(231,235,255,0) 62%),
      radial-gradient(620px 380px at 4% 96%, #EDF7F3 0%, rgba(237,247,243,0) 60%),
      linear-gradient(180deg, #FFFFFF 0%, #FAFBFD 100%);
    padding: 56px 72px;
    display: flex; align-items: center; gap: 40px;
  }
  .left { flex: 0 0 auto; }
  .icon {
    width: 132px; height: 132px; border-radius: 34px;
    box-shadow: 0 18px 44px rgba(43,92,230,.22), 0 2px 6px rgba(0,0,0,.06);
    background: #fff;
  }
  .mid { flex: 1 1 auto; min-width: 0; }
  h1 {
    font-size: 52px; font-weight: 700; letter-spacing: -.5px; line-height: 1.06;
  }
  .sub {
    margin-top: 12px; font-size: 22px; color: #4C5468; font-weight: 400;
    letter-spacing: .2px;
  }
  .chips { margin-top: 26px; display: flex; gap: 10px; flex-wrap: wrap; }
  .chip {
    font-size: 14px; color: #3A4256; background: #fff;
    border: 1px solid #E3E6EF; border-radius: 999px;
    padding: 7px 15px; box-shadow: 0 1px 2px rgba(16,24,40,.04);
  }
  .chip b { font-weight: 600; color: #1B1E28; }
  .right { flex: 0 0 300px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .grid img {
    width: 38px; height: 38px; border-radius: 50%;
    background: #fff; border: 1px solid #E8EAF2; padding: 4px;
  }
  .grid.g2 img { opacity: .92; }
  .note {
    margin-top: 14px; font-size: 12px; color: #8A90A2; text-align: right;
    letter-spacing: .3px;
  }
</style></head>
<body>
<div class="card">
  <div class="left"><img class="icon" src="icon.png"></div>
  <div class="mid">
    <h1>AI dock</h1>
    <div class="sub">12 个 AI 助手，一个入口 · 国产 8 + 海外 4</div>
    <div class="chips">
      <span class="chip"><b>Kotlin</b> + Jetpack Compose</span>
      <span class="chip">Material 3</span>
      <span class="chip">minSdk <b>24</b></span>
      <span class="chip">无广告 · 不收集数据</span>
    </div>
  </div>
  <div class="right">
    <div class="grid" id="g1"></div>
    <div style="height:12px"></div>
    <div class="grid g2" id="g2"></div>
    <div class="note">官方 LOGO · 各自商标归其所有者</div>
  </div>
</div>
<script>
  const R = "file:///D:/workbuddy/aidock/app/src/main/res/drawable-xxxhdpi/";
  const all = ["doubao","qwen","yuanbao","deepseek","kimi","spark",
               "chatglm","ernie","chatgpt","gemini","claude","copilot"];
  for (let i = 0; i < 6; i++) {
    document.getElementById("g1").innerHTML += '<img src="' + R + "logo_" + all[i] + '.png">';
  }
  for (let i = 6; i < 12; i++) {
    document.getElementById("g2").innerHTML += '<img src="' + R + "logo_" + all[i] + '.png">';
  }
</script>
</body></html>
